# Copy this file to config/local-ai.properties, then fill in your own config.
# local-ai.properties is ignored by git.

# For the official OpenAI API, this endpoint can be omitted in local-ai.properties.
# The code will use this default value:
# https://api.openai.com/v1/chat/completions
# If you use another OpenAI-compatible provider, put its chat completions URL here.
CLOSURE_AI_ENDPOINT=https://api.openai.com/v1/chat/completions

# Put your real API key in local-ai.properties, not in this example file.
CLOSURE_AI_API_KEY=replace-with-your-api-key

# Model name to use.
CLOSURE_AI_MODEL=gpt-4.1-mini
