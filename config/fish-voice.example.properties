# Copy to config/local-fish-voice.properties and enter your key locally.
# Never commit the populated file or paste the key into a chat.
# Selection is explicit: CLOSURE_VOICE_BACKEND=fish.
fish.apiKey=
fish.model=s2.1-pro-free
fish.referenceId=4632f51d7f524e6da1952135e498a6a3
fish.baseUrl=https://api.fish.audio
voice.autoSpeak=true

# Model names are exact: s2.1-pro-free (free tier) or drama-3 (paid, explicit).
# s2.1-pro is a paid model and is not accepted by this configuration.
