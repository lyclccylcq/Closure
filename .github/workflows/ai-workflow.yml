name: Closure checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closure-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    name: workflow-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate all task specifications
        run: python3 scripts/ai_workflow.py validate
      - name: Exercise workflow guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate PR task and changed paths
        if: github.event_name == 'pull_request'
        run: python3 scripts/ai_workflow.py ci --event "$GITHUB_EVENT_PATH"

  java-tests:
    name: java-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fonts for Chinese text coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk xvfb xauth
      - name: Run existing unit tests without live AI services
        run: ./mvnw -B -Djava.awt.headless=true test
      - name: Build the deliverable
        run: ./mvnw -B -DskipTests package
      - name: Verify real desktop window startup without external services
        run: python3 scripts/verify_startup.py
