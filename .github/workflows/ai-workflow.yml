name: Closure checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closure-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    name: workflow-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate all task specifications
        run: python3 scripts/ai_workflow.py validate
      - name: Exercise workflow guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate PR task and changed paths
        if: github.event_name == 'pull_request'
        run: python3 scripts/ai_workflow.py ci --event "$GITHUB_EVENT_PATH"

  java-tests:
    name: java-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fonts for Chinese text coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Run existing unit tests without live AI services
        run: ./mvnw -B -Djava.awt.headless=true test
